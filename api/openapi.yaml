components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthBody:
      additionalProperties: false
      properties:
        status:
          description: Always "ok" when the API is healthy.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    InfoBody:
      additionalProperties: false
      properties:
        latestRelease:
          $ref: "#/components/schemas/LatestRelease"
          description: The newest release. Absent when the running version is up to date, or when the update check is disabled or has not succeeded yet.
        version:
          description: Version of the running API.
          examples:
            - 1.4.0
          type: string
      required:
        - version
      type: object
    LatestRelease:
      additionalProperties: false
      properties:
        publishedAt:
          format: date-time
          type: string
        url:
          description: Link to the release page.
          type: string
        version:
          description: Version without a leading "v".
          examples:
            - 1.4.1
          type: string
      required:
        - version
        - url
        - publishedAt
      type: object
info:
  title: FrozenFortress API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/system/health:
    get:
      description: Used by the container healthcheck. Pings the database only; never touches Redis or Ollama.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Liveness and database check
      tags:
        - System
  /api/system/info:
    get:
      operationId: getInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Version and update information
      tags:
        - System
