name: Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0 or 0.1.0-beta1)'
        required: true
        type: string
      tag_name:
        description: 'Tag name (e.g., android-v0.1.0 or android-v0.1.0-beta1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Extract version
      id: extract_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          TAG_NAME="${{ github.event.inputs.tag_name }}"
        else
          VERSION=${GITHUB_REF#refs/tags/android-v}
          TAG_NAME=${GITHUB_REF#refs/tags/}
        fi

        # A version with a hyphen (e.g. "0.1.0-beta1") is a semver prerelease -
        # mark the GitHub Release as a pre-release automatically.
        PRERELEASE=false
        if [[ "$VERSION" == *-* ]]; then
          PRERELEASE=true
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        echo "Tag: $TAG_NAME"
        echo "Prerelease: $PRERELEASE"

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

    - name: Decode release keystore
      working-directory: companion-app-android
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks
        echo "RELEASE_KEYSTORE_PATH=$(pwd)/release.keystore.jks" >> $GITHUB_ENV

    - name: Run tests, lint, and build the release APK
      working-directory: companion-app-android
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        chmod +x gradlew
        ./gradlew test lintRelease assembleRelease --console=plain

    - name: Remove decoded keystore
      if: always()
      run: rm -f companion-app-android/release.keystore.jks

    - name: Check if release already exists
      id: check_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${{ steps.extract_version.outputs.tag_name }}" > /dev/null 2>&1; then
          echo "Release already exists for tag ${{ steps.extract_version.outputs.tag_name }}, skipping."
          echo "skip_release=true" >> $GITHUB_OUTPUT
        else
          echo "skip_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Rename APK for release
      if: steps.check_release.outputs.skip_release == 'false'
      run: |
        APK_NAME="frozenfortress-companion-android-v${{ steps.extract_version.outputs.version }}.apk"
        cp "companion-app-android/app/build/outputs/apk/release/app-release.apk" "$APK_NAME"
        echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

    - name: Create GitHub Release
      if: steps.check_release.outputs.skip_release == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > release_notes.md << 'EOF'
        ## FrozenFortress Companion (Android) v${{ steps.extract_version.outputs.version }}

        Scans physical documents from your phone (Google ML Kit Document Scanner)
        and hands the result to FrozenFortress's "Create Document" page over a
        one-time encrypted handoff. Side-loaded only - not distributed via the
        Play Store.

        **Install:**
        1. Download the APK below to your Android device (minimum Android 8.0 /
           API 26; requires Google Play Services for the document scanner).
        2. Enable "Install unknown apps" for the app you downloaded it with.
        3. Open the APK to install.
        4. On the FrozenFortress "Create Document" page, tap "Scan with
           companion app".

        **Signing:** this release is signed with FrozenFortress Companion's stable
        release key, so installing a newer release over an older one upgrades in
        place - no need to uninstall first.

        **Commit:** ${{ github.sha }}
        EOF

        gh release create "${{ steps.extract_version.outputs.tag_name }}" \
          "${{ env.APK_NAME }}" \
          --title "FrozenFortress Companion (Android) v${{ steps.extract_version.outputs.version }}" \
          --notes-file release_notes.md \
          $( [ "${{ steps.extract_version.outputs.prerelease }}" = "true" ] && echo "--prerelease" )

        echo "Release created successfully!"
