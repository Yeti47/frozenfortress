name: Docker Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      tag_name:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Extract version
      id: extract_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          TAG_NAME="${{ github.event.inputs.tag_name }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG_NAME=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        echo "Tag: $TAG_NAME"

    - name: Build images
      env:
        APP_VERSION: ${{ steps.extract_version.outputs.version }}
      run: |
        # Both ollama variants build to the same local name, so tag the CPU
        # one separately before the default build overwrites it.
        docker compose -f compose.yaml -f compose.cpu.yaml build ollama
        docker tag frozenfortress-ollama frozenfortress-ollama-cpu
        docker compose build

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push images to GHCR and capture digests
      id: push_images
      run: |
        REGISTRY="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
        VERSION="${{ steps.extract_version.outputs.version }}"

        push_image() {
          local local_name="$1"
          local remote_name="$2"
          local tag="${REGISTRY}/${remote_name}:${VERSION}${3:-}"

          docker tag "$local_name" "$tag" >&2
          docker push "$tag" >&2

          # Resolve the repo digest (ghcr.io/...@sha256:...)
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")
          echo "$digest"
        }

        WEBUI_DIGEST=$(push_image  frozenfortress-webui  frozenfortress/webui)
        NGINX_DIGEST=$(push_image  frozenfortress-nginx  frozenfortress/nginx)
        OLLAMA_DIGEST=$(push_image frozenfortress-ollama frozenfortress/ollama)
        OLLAMA_CPU_DIGEST=$(push_image frozenfortress-ollama-cpu frozenfortress/ollama -cpu)

        echo "webui_digest=$WEBUI_DIGEST"   >> $GITHUB_OUTPUT
        echo "nginx_digest=$NGINX_DIGEST"   >> $GITHUB_OUTPUT
        echo "ollama_digest=$OLLAMA_DIGEST" >> $GITHUB_OUTPUT
        echo "ollama_cpu_digest=$OLLAMA_CPU_DIGEST" >> $GITHUB_OUTPUT

    - name: Generate release compose files
      run: |
        python3 - << 'PYEOF'
        import re

        with open('compose.yaml') as f:
            src = f.read()

        webui_digest  = "${{ steps.push_images.outputs.webui_digest }}"
        nginx_digest  = "${{ steps.push_images.outputs.nginx_digest }}"
        ollama_digest = "${{ steps.push_images.outputs.ollama_digest }}"
        ollama_cpu_digest = "${{ steps.push_images.outputs.ollama_cpu_digest }}"

        # Replace each service's build block (the build: line and every
        # line indented below it, e.g. context and target) with an image reference.
        def replace_build(service, digest, text):
            pattern = (
                r'(?m)'                         # multiline
                r'(^  ' + service + r':.*?\n)'  # service header line
                r'((?:    .+\n)*?)'             # any lines before build (captured)
                r'    build:\n'                  # build: line
                r'(?:      .+\n)+'               # context:, target:, ... lines
            )
            replacement = (
                r'\1\2'
                r'    image: ' + digest + r'\n'
            )
            return re.sub(pattern, replacement, text)

        src = replace_build('nginx',  nginx_digest,  src)
        src = replace_build('webui',  webui_digest,  src)
        src = replace_build('ollama', ollama_digest, src)

        with open('compose.release.yaml', 'w') as f:
            f.write(src)

        with open('compose.cpu.yaml') as f:
            cpu_src = f.read()

        cpu_out = replace_build('ollama', ollama_cpu_digest, cpu_src)
        if cpu_out == cpu_src:
            raise SystemExit("compose.cpu.yaml: ollama build block not found")

        with open('compose.cpu.release.yaml', 'w') as f:
            f.write(cpu_out)

        print("compose.release.yaml and compose.cpu.release.yaml generated successfully.")
        PYEOF

    - name: Validate release compose files
      run: |
        docker compose -f compose.release.yaml config --quiet
        docker compose -f compose.release.yaml -f compose.cpu.release.yaml config --quiet

    - name: Assemble release archive
      run: |
        RELEASE_DIR="frozenfortress-docker-v${{ steps.extract_version.outputs.version }}"
        mkdir -p "$RELEASE_DIR"
        cp compose.release.yaml "$RELEASE_DIR/compose.yaml"
        cp compose.cpu.release.yaml "$RELEASE_DIR/compose.cpu.yaml"
        cp doc/setup-docker.md "$RELEASE_DIR/"
        cp README.md "$RELEASE_DIR/"
        zip -r "${RELEASE_DIR}.zip" "$RELEASE_DIR/"
        echo "RELEASE_ZIP=${RELEASE_DIR}.zip" >> $GITHUB_ENV

    - name: Check if release already exists
      id: check_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "${{ steps.extract_version.outputs.tag_name }}" > /dev/null 2>&1; then
          echo "Release already exists for tag ${{ steps.extract_version.outputs.tag_name }}, skipping."
          echo "skip_release=true" >> $GITHUB_OUTPUT
        else
          echo "skip_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      if: steps.check_release.outputs.skip_release == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > release_notes.md << 'EOF'
        ## Frozen Fortress v${{ steps.extract_version.outputs.version }}

        Docker-native release. Pre-built images are published to GHCR — no build step required.

        **Requirements:**
        - Docker Engine with Compose plugin, on an x86-64 (linux/amd64) host

        **Quick start:**
        1. Download and extract the release archive
        2. In the extracted folder, run `docker compose up -d` (the first start downloads about 6 GB)
        3. Open https://localhost:8443, click "Request access", then activate your account with `docker compose exec webui /app/ffcli user activate <username>`

        **CPU-only OCR:** hosts without a GPU can use a smaller OCR image that leaves out the GPU runtimes (about 6 GB less). Add `COMPOSE_FILE=compose.yaml:compose.cpu.yaml` to a `.env` file next to `compose.yaml` before running `docker compose up -d`. See `setup-docker.md`.

        **Upgrading:** run `docker compose down` in your old folder, extract this release, copy your `.env` file into the new folder if you have one, and run `docker compose up -d` there. Your data is kept.

        **Images (digest-pinned):**
        - `${{ steps.push_images.outputs.webui_digest }}`
        - `${{ steps.push_images.outputs.nginx_digest }}`
        - `${{ steps.push_images.outputs.ollama_digest }}`
        - `${{ steps.push_images.outputs.ollama_cpu_digest }}` (CPU-only)

        See `README.md` and `setup-docker.md` in the archive for full instructions.

        **Commit:** ${{ github.sha }}
        EOF

        gh release create "${{ steps.extract_version.outputs.tag_name }}" \
          "${{ env.RELEASE_ZIP }}" \
          --title "Frozen Fortress v${{ steps.extract_version.outputs.version }}" \
          --notes-file release_notes.md

        echo "Release created successfully!"

